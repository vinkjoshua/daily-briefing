name: Daily briefing
on:
  schedule:
    # The first success sends; later attempts skip. Times use this IANA timezone.
    - cron: "0 7,8,9 * * *"
      timezone: "Etc/UTC"
  workflow_dispatch:
    inputs:
      force:
        description: Send again even if today's briefing was already sent
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: daily-briefing
  cancel-in-progress: false
jobs:
  briefing:
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.ref }}
      - uses: vinkjoshua/daily-briefing@v1
        with:
          timezone: "Etc/UTC"
          smtp-host: "smtp.gmail.com"
          smtp-port: "465"
          mail-to: ""
          smtp-user: ${{ secrets.SMTP_USER }}
          smtp-password: ${{ secrets.SMTP_PASSWORD }}
          auth-key: ${{ secrets.BRIEFING_KEY }}
          force: ${{ inputs.force || false }}
