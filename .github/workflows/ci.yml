name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        python: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --frozen --python '${{ matrix.python }}'
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest
      # Explicit builds and an isolated install prevent a skipped optional test
      # from making CI green with missing packaged starter resources.
      - run: uv build --python '${{ matrix.python }}'
      - name: Rebuild wheel from source distribution
        run: uv build dist/*.tar.gz --wheel --python '${{ matrix.python }}' --out-dir "$RUNNER_TEMP/sdist-wheel"
      - name: Install built wheel outside the checkout
        run: |
          uv venv --python '${{ matrix.python }}' "$RUNNER_TEMP/artifact-smoke"
          uv pip install --python "$RUNNER_TEMP/artifact-smoke/bin/python" "$RUNNER_TEMP"/sdist-wheel/*.whl
      - name: Smoke installed CLI and packaged resources
        working-directory: ${{ runner.temp }}
        run: |
          export PATH="$RUNNER_TEMP/artifact-smoke/bin:$PATH"
          "$RUNNER_TEMP/artifact-smoke/bin/python" "$GITHUB_WORKSPACE/tests/package_smoke.py" "$GITHUB_WORKSPACE"
  actionlint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: |
          # The versioned script still defaults to 1.7.11; pass the binary version too.
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color .github/workflows/*.yml template/.github/workflows/*.yml
